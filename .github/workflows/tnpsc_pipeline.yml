name: TNPSC Questions & Answer Key Pipeline

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Comma-separated TNPSC dropdown years (e.g. 0,2025,2024)"
        required: false
        default: "0,2025,2024"
      max_pages_per_pdf:
        description: "Max pages to parse per PDF booklet"
        required: false
        default: "40"
  schedule:
    # Runs weekly on Sundays at 02:00 UTC (07:30 AM IST)
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run TNPSC pipeline
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME || 'postgres' }}
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
          DB_PASS: ${{ secrets.DB_PASS }}
          WORK_DIR: ./tnpsc_full_pipeline
          YEARS_TO_CRAWL: ${{ inputs.years || '0,2025,2024' }}
          MAX_PAGES_PER_PDF: ${{ inputs.max_pages_per_pdf || '40' }}
        run: python scripts/tnpsc_pipeline.py

      - name: Upload checkpoint JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tnpsc-parsed-questions
          path: tnpsc_full_pipeline/parsed_questions_checkpoint.json
          if-no-files-found: ignore
