name: Analyze Paper & Generate Answers

on:
  workflow_dispatch:
    inputs:
      exam_tag:
        description: "Optional exam tag filter (e.g. GROUP_2, GROUP_2A, GROUP_1, GROUP_4, TET_ELIGIBILITY, APP_GRADE_2, SUBJECT_PAPERS, TECH_SERVICES)"
        required: false
        default: ""
      source_url:
        description: "Optional exact source_url filter"
        required: false
        default: ""
      batch_size:
        description: "Questions per LLM batch (recommended 8 for 8,000 TPM)"
        required: false
        default: "8"
      max_questions:
        description: "Max unanswered questions to process in this run"
        required: false
        default: "200"
      check_pdf_ticks:
        description: "Scan PDF text for tick/answer hints (true/false)"
        required: false
        default: "true"

jobs:
  analyze-answers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf

      - name: Run answer analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'openai/gpt-oss-120b' }}
          EXAM_TAG_FILTER: ${{ inputs.exam_tag || '' }}
          SOURCE_URL_FILTER: ${{ inputs.source_url || '' }}
          ANALYZE_BATCH_SIZE: ${{ inputs.batch_size || '8' }}
          MAX_ANALYZE_QUESTIONS: ${{ inputs.max_questions || '200' }}
          CHECK_PDF_TICKS: ${{ inputs.check_pdf_ticks || 'true' }}
        run: python -u scripts/analyze_paper_answers.py
